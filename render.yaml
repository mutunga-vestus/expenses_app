services:
  - type: web
    name: expenses        
    runtime: python
    plan: free           
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn expensesapp.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expensesdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.12.0     # or whatever version you use

databases:
  - name: expensesdb
    plan: free